<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Split the bill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EAF0EE; --surface: #FFFFFF; --ink: #1C2B33; --muted: #5E6F75;
  --line: #C9D5D1; --accent: #2F6B5E; --accent-ink: #FFFFFF; --danger: #A3412F;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121A1D; --surface: #1B272B; --ink: #E4EDEA; --muted: #94A6A3;
    --line: #2E3F43; --accent: #72C3AE; --accent-ink: #0F1A17; --danger: #E68C78;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121A1D; --surface: #1B272B; --ink: #E4EDEA; --muted: #94A6A3;
  --line: #2E3F43; --accent: #72C3AE; --accent-ink: #0F1A17; --danger: #E68C78;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5;
}
main { max-width: 36rem; margin: 0 auto; padding: 2.5rem 1.25rem 3rem; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; }
h1 { font-size: 1.1rem; font-weight: 600; margin: 0; color: var(--muted); }
h2 { font-size: 1rem; font-weight: 600; margin: 0 0 .75rem; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { border: 0; border-radius: 0; padding: .3rem .8rem; font-size: .9rem; font-weight: 600; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: .75rem; }
.panel-head h2 { margin: 0; }
.currency button { font-size: 1rem; min-width: 2.5rem; }
.result {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  margin: 0 -1.25rem 1.25rem; padding: .75rem 1.25rem .85rem;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; z-index: 10;
  height: env(safe-area-inset-top, 0px); background: var(--bg);
}
.label { color: var(--muted); font-size: .9rem; margin-bottom: .1rem; }
.amount {
  font-size: clamp(2.2rem, 10vw, 2.8rem); font-weight: 800; line-height: 1.05;
  letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
}
.amount.over { color: var(--danger); }
.amount.done { color: var(--accent); }
.sub { color: var(--muted); font-size: .9rem; margin-top: .3rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.25rem; }
.panel + .panel { margin-top: 1rem; }
input[type="text"] {
  font: inherit; font-size: 1.1rem; padding: .55rem .7rem; width: 100%; min-width: 0;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
}
#total { font-size: 1.4rem; font-weight: 600; }
.person + .person { margin-top: .9rem; padding-top: .9rem; border-top: 1px solid var(--line); }
.inputs { display: grid; grid-template-columns: 3.8rem 1fr 2.6rem 2.6rem; gap: .5rem; align-items: center; }
.initials { text-transform: uppercase; text-align: center; font-weight: 800; letter-spacing: .05em; }
.meta { display: flex; justify-content: space-between; gap: 1rem; margin-top: .35rem; font-size: .95rem; }
.calc { color: var(--muted); font-variant-numeric: tabular-nums; }
.owes { font-variant-numeric: tabular-nums; white-space: nowrap; }
.owes strong { font-size: 1.15rem; }
button {
  font: inherit; cursor: pointer; border-radius: 999px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: .45rem .95rem;
}
button:disabled { opacity: .35; cursor: default; }
.plus, .divide { width: 2.6rem; height: 2.6rem; padding: 0; font-size: 1.3rem; font-weight: 600; border-radius: 8px; }
.right { display: flex; align-items: center; gap: .35rem; }
.remove { width: 2rem; height: 2rem; padding: 0; font-size: 1.1rem; color: var(--danger); background: transparent; border-color: transparent; }
.remove:hover { border-color: var(--line); }
.add { margin-top: 1rem; width: 100%; border-style: dashed; border-radius: 8px; padding: .6rem; }
.stepper { display: flex; align-items: center; gap: 1rem; }
.stepper output { min-width: 4.5ch; text-align: center; font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.step { width: 2.8rem; height: 2.8rem; padding: 0; font-size: 1.4rem; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.note { color: var(--muted); font-size: .9rem; margin-top: 1.5rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 data-i18n="title">Split the bill</h1>
    <div class="lang" role="group" aria-label="Language / Idioma">
      <button type="button" data-lang="en" lang="en">EN</button>
      <button type="button" data-lang="es" lang="es">ES</button>
    </div>
  </div>

  <section class="result" aria-live="polite">
    <div class="label" id="hero-label"></div>
    <div class="amount" id="hero">£0.00</div>
    <div class="sub" id="summary"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2><label for="total" data-i18n="totalLabel">Bill total (before service)</label></h2>
      <div class="lang currency" role="group" id="currency">
        <button type="button" data-currency="GBP">£</button>
        <button type="button" data-currency="EUR">€</button>
        <button type="button" data-currency="USD">$</button>
      </div>
    </div>
    <input id="total" type="text" inputmode="decimal" autocomplete="off" placeholder="64.50">
  </section>

  <section class="panel">
    <h2 data-i18n="whoHadWhat">Who had what</h2>
    <div id="rows"></div>
    <button type="button" class="add" id="add" data-i18n="addPerson">Add person</button>
  </section>

  <section class="panel">
    <h2 id="tip-label" data-i18n="service">Service</h2>
    <div class="stepper" role="group" aria-labelledby="tip-label">
      <button type="button" class="step" id="tip-down">−</button>
      <output id="tip" aria-live="polite">12.5%</output>
      <button type="button" class="step" id="tip-up">+</button>
    </div>
  </section>

  <p class="note" data-i18n="note"></p>
</main>
<script>
// ---- Translations: add a new language by copying one block ----
const I18N = {
  en: {
    htmlLang: "en-GB",
    title: "Split the bill",
    totalLabel: "Bill total (before service)",
    currencyGroup: "Currency",
    currencyNames: { GBP: "British pounds", EUR: "Euros", USD: "US dollars" },
    whoHadWhat: "Who had what",
    addPerson: "Add person",
    service: "Service",
    none: "None",
    owes: "owes",
    leftToAssign: "Left to assign",
    overBy: "Over the bill by",
    allAssigned: "Everything’s assigned",
    assignedSoFar: "Assigned so far",
    typeTotal: "Type the bill total to see what’s left",
    summary: (total, withService, tip) => `of a ${total} bill, which comes to ${withService} with ${tip}% service`,
    initialsFor: n => `Initials for person ${n}`,
    spentBy: n => `Amount spent by person ${n}`,
    addItem: n => `Add another item for person ${n}`,
    divideItem: n => `Divide the last amount for person ${n}`,
    removePerson: n => `Remove person ${n}`,
    tipDown: "Lower service by 0.5%",
    tipUp: "Raise service by 0.5%",
    note: "To add up items, type them with + (for example 12.50+4+3.20) or tap the + button. To get one item from a line like “Coca-Cola 3 11.25”, type 11.25/3 or tap ÷. Service is shared in proportion to what each person spent. Your last bill is remembered in this browser."
  },
  es: {
    htmlLang: "es",
    title: "Dividir la cuenta",
    totalLabel: "Total de la cuenta (sin servicio)",
    currencyGroup: "Moneda",
    currencyNames: { GBP: "Libras esterlinas", EUR: "Euros", USD: "Dólares estadounidenses" },
    whoHadWhat: "Lo que consumió cada uno",
    addPerson: "Añadir persona",
    service: "Servicio",
    none: "Sin servicio",
    owes: "debe",
    leftToAssign: "Falta por asignar",
    overBy: "Se pasa de la cuenta por",
    allAssigned: "Todo asignado",
    assignedSoFar: "Asignado hasta ahora",
    typeTotal: "Escribe el total de la cuenta para ver lo que falta",
    summary: (total, withService, tip) => `de una cuenta de ${total}, que queda en ${withService} con ${tip}% de servicio`,
    initialsFor: n => `Iniciales de la persona ${n}`,
    spentBy: n => `Importe que gastó la persona ${n}`,
    addItem: n => `Añadir otro importe a la persona ${n}`,
    divideItem: n => `Dividir el último importe de la persona ${n}`,
    removePerson: n => `Quitar a la persona ${n}`,
    tipDown: "Bajar el servicio un 0,5%",
    tipUp: "Subir el servicio un 0,5%",
    note: "Para sumar, escribe los importes con + (por ejemplo 12.50+4+3.20) o toca el botón +. Para sacar una unidad de una línea como «Coca-Cola 3 11.25», escribe 11.25/3 o toca ÷. El servicio se reparte según lo que gastó cada persona. Tu última cuenta se guarda en este navegador."
  }
};

let lang = "en";
try {
  lang = localStorage.getItem("split-lang") || ((navigator.language || "").toLowerCase().startsWith("es") ? "es" : "en");
} catch (e) {}
if (!I18N[lang]) lang = "en";
const t = key => I18N[lang][key];

let state = { total: "", tip: 12.5, people: [{ initials: "", spent: "" }, { initials: "", spent: "" }] };
try {
  const saved = JSON.parse(localStorage.getItem("split-v3") || "null");
  if (saved && Array.isArray(saved.people)) state = saved;
} catch (e) {}

const $ = id => document.getElementById(id);
const CURRENCIES = ["GBP", "EUR", "USD"];
let currency = "GBP";
try { currency = localStorage.getItem("split-currency") || "GBP"; } catch (e) {}
if (!CURRENCIES.includes(currency)) currency = "GBP";
const fmt = n => n.toLocaleString("en-GB", { style: "currency", currency, currencyDisplay: "narrowSymbol" });
const save = () => { try { localStorage.setItem("split-v3", JSON.stringify(state)); } catch (e) {} };

// Adds up "12.50 + 4 + 3,20" style input (a comma also works as the decimal point)
const num = s => { const n = parseFloat(String(s).replace(",", ".").replace(/[^0-9.]/g, "")); return isNaN(n) ? null : n; };
// "12.50+11.25/3" = 12.50 + (11.25 ÷ 3). Unfinished bits like "11.25/" are ignored while typing.
function sumOf(text) {
  return String(text || "").split("+").reduce((total, term) => {
    const parts = term.split(/([*\/])/);
    let value = num(parts[0]);
    if (value === null) return total;
    for (let i = 1; i < parts.length; i += 2) {
      const n = num(parts[i + 1]);
      if (n === null) continue;
      if (parts[i] === "/") { if (n !== 0) value /= n; } else value *= n;
    }
    return total + value;
  }, 0);
}
const clean = v => v.replace(/[^0-9.,+\/* ]/g, "");

function applyLanguage() {
  document.documentElement.lang = t("htmlLang");
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("button[data-lang]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("tip-down").setAttribute("aria-label", t("tipDown"));
  $("tip-up").setAttribute("aria-label", t("tipUp"));
  $("currency").setAttribute("aria-label", t("currencyGroup"));
  document.querySelectorAll("#currency button").forEach(b => {
    b.setAttribute("aria-label", t("currencyNames")[b.dataset.currency]);
    b.title = t("currencyNames")[b.dataset.currency];
    b.setAttribute("aria-pressed", String(b.dataset.currency === currency));
  });
  buildRows(); update();
}

function buildRows() {
  const rows = $("rows");
  rows.innerHTML = "";
  state.people.forEach((p, i) => {
    const n = i + 1;
    const row = document.createElement("div");
    row.className = "person";
    row.innerHTML = `
      <div class="inputs">
        <label class="sr" for="in-${i}">${t("initialsFor")(n)}</label>
        <input class="initials" id="in-${i}" type="text" maxlength="3" autocomplete="off" placeholder="${String.fromCharCode(65 + (i % 26))}">
        <label class="sr" for="sp-${i}">${t("spentBy")(n)}</label>
        <input id="sp-${i}" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">
        <button type="button" class="plus" aria-label="${t("addItem")(n)}">+</button>
        <button type="button" class="divide" aria-label="${t("divideItem")(n)}">÷</button>
      </div>
      <div class="meta">
        <span class="calc" id="calc-${i}"></span>
        <span class="right">
          <span class="owes">${t("owes")} <strong id="ow-${i}">£0.00</strong></span>
          <button type="button" class="remove" aria-label="${t("removePerson")(n)}">×</button>
        </span>
      </div>`;
    const [ini, sp] = row.querySelectorAll("input");
    ini.value = p.initials; sp.value = p.spent;
    ini.addEventListener("input", e => { p.initials = e.target.value.toUpperCase(); e.target.value = p.initials; update(); });
    sp.addEventListener("input", e => { p.spent = clean(e.target.value); e.target.value = p.spent; update(); });
    const addOperator = op => {
      const v = p.spent.trim();
      if (v && !/[+\/*]$/.test(v)) p.spent = v + op;
      sp.value = p.spent; sp.focus(); update();
    };
    row.querySelector(".plus").addEventListener("click", () => addOperator("+"));
    row.querySelector(".divide").addEventListener("click", () => addOperator("/"));
    const rm = row.querySelector(".remove");
    rm.disabled = state.people.length <= 1;
    rm.addEventListener("click", () => { state.people.splice(i, 1); buildRows(); update(); });
    rows.appendChild(row);
  });
}

function update() {
  const factor = 1 + state.tip / 100;
  const total = sumOf(state.total);
  let assigned = 0;
  state.people.forEach((p, i) => {
    const spent = sumOf(p.spent);
    assigned += spent;
    $("ow-" + i).textContent = fmt(spent * factor);
    $("calc-" + i).textContent = /[+\/*]/.test(p.spent)
      ? `${p.spent.replace(/\s+/g, "").replace(/[+\/*]+$/, "").replace(/\+/g, " + ").replace(/\//g, " ÷ ").replace(/\*/g, " × ")} = ${fmt(spent)}` : "";
  });

  const hero = $("hero");
  hero.classList.remove("over", "done");
  if (!total) {
    $("hero-label").textContent = t("assignedSoFar");
    hero.textContent = fmt(assigned);
    $("summary").textContent = t("typeTotal");
  } else {
    const left = Math.round((total - assigned) * 100) / 100;
    if (left > 0) {
      $("hero-label").textContent = t("leftToAssign");
      hero.textContent = fmt(left);
    } else if (left < 0) {
      $("hero-label").textContent = t("overBy");
      hero.textContent = fmt(-left);
      hero.classList.add("over");
    } else {
      $("hero-label").textContent = t("allAssigned");
      hero.textContent = fmt(0);
      hero.classList.add("done");
    }
    $("summary").textContent = t("summary")(fmt(total), fmt(total * factor), state.tip);
  }
  $("tip").textContent = state.tip ? state.tip + "%" : t("none");
  $("tip-down").disabled = state.tip <= 0;
  $("tip-up").disabled = state.tip >= 30;
  save();
}

$("total").value = state.total;
$("total").addEventListener("input", e => { state.total = clean(e.target.value); e.target.value = state.total; update(); });
$("add").addEventListener("click", () => {
  state.people.push({ initials: "", spent: "" });
  buildRows(); update();
  $("in-" + (state.people.length - 1)).focus();
});
const stepTip = d => { state.tip = Math.min(30, Math.max(0, Math.round((state.tip + d) * 2) / 2)); update(); };
$("tip-down").addEventListener("click", () => stepTip(-0.5));
$("tip-up").addEventListener("click", () => stepTip(0.5));
document.querySelectorAll("button[data-lang]").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("split-lang", lang); } catch (e) {}
  applyLanguage();
}));
document.querySelectorAll("#currency button").forEach(b => b.addEventListener("click", () => {
  currency = b.dataset.currency;
  try { localStorage.setItem("split-currency", currency); } catch (e) {}
  applyLanguage();
}));
applyLanguage();
</script>
</body>
</html>
