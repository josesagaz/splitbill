<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Split the bill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EAF0EE; --surface: #FFFFFF; --ink: #1C2B33; --muted: #5E6F75;
  --line: #C9D5D1; --accent: #2F6B5E; --accent-ink: #FFFFFF; --danger: #A3412F;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121A1D; --surface: #1B272B; --ink: #E4EDEA; --muted: #94A6A3;
    --line: #2E3F43; --accent: #72C3AE; --accent-ink: #0F1A17; --danger: #E68C78;
    color-scheme: dark;
  }
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5;
}
main { max-width: 36rem; margin: 0 auto; padding: 2.5rem 1.25rem 3rem; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; }
h1 { font-size: 1.1rem; font-weight: 600; margin: 0; color: var(--muted); }
h2 { font-size: 1rem; font-weight: 600; margin: 0 0 .75rem; }
.muted { color: var(--muted); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: .3rem .8rem; font-size: .9rem; font-weight: 600; }
.currency button { font-size: 1rem; min-width: 2.5rem; }
.result {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  margin: 0 -1.25rem 1.25rem; padding: .75rem 1.25rem .85rem;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; z-index: 10;
  height: env(safe-area-inset-top, 0px); background: var(--bg);
}
.label { color: var(--muted); font-size: .9rem; margin-bottom: .1rem; }
.amount {
  font-size: clamp(2.2rem, 10vw, 2.8rem); font-weight: 800; line-height: 1.05;
  letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
}
.amount.over { color: var(--danger); }
.amount.done { color: var(--accent); }
.sub { color: var(--muted); font-size: .9rem; margin-top: .3rem; }
.status { color: var(--danger); font-size: .85rem; margin-top: .25rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.25rem; }
.panel + .panel { margin-top: 1rem; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: .75rem; }
.panel-head h2 { margin: 0; }
input[type="text"] {
  font: inherit; font-size: 1.1rem; padding: .55rem .7rem; width: 100%; min-width: 0;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
}
#total { font-size: 1.4rem; font-weight: 600; }
.codebar { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
.code { font-size: 1.6rem; font-weight: 800; letter-spacing: .12em; }
.codebar .actions { display: flex; gap: .5rem; }
.person + .person { margin-top: .9rem; padding-top: .9rem; border-top: 1px solid var(--line); }
.inputs { display: grid; grid-template-columns: 3.8rem 1fr 2.6rem 2.6rem; gap: .5rem; align-items: center; }
.initials { text-transform: uppercase; text-align: center; font-weight: 800; letter-spacing: .05em; }
.meta { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-top: .35rem; font-size: .95rem; }
.left { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
.you { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 .55rem; font-size: .8rem; font-weight: 600; }
.calc { color: var(--muted); font-variant-numeric: tabular-nums; }
.owes { font-variant-numeric: tabular-nums; white-space: nowrap; }
.owes strong { font-size: 1.15rem; }
.empty { color: var(--muted); margin: 0; }
button {
  font: inherit; cursor: pointer; border-radius: 999px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: .45rem .95rem;
}
button:disabled { opacity: .35; cursor: default; }
.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; padding: .7rem 1.2rem; }
.wide { width: 100%; }
.plus, .divide { width: 2.6rem; height: 2.6rem; padding: 0; font-size: 1.3rem; font-weight: 600; border-radius: 8px; }
.right { display: flex; align-items: center; gap: .35rem; }
.remove { width: 2rem; height: 2rem; padding: 0; font-size: 1.1rem; color: var(--danger); background: transparent; border-color: transparent; }
.remove:hover { border-color: var(--line); }
.add-row { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: 1rem; }
.add-row button { border-radius: 8px; padding: .6rem; }
.add-row .dashed { border-style: dashed; }
.stepper { display: flex; align-items: center; gap: 1rem; }
.stepper output { min-width: 4.5ch; text-align: center; font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.step { width: 2.8rem; height: 2.8rem; padding: 0; font-size: 1.4rem; }
.join { margin-top: 1.5rem; }
.join label { display: block; font-weight: 600; margin-bottom: .4rem; }
.join-row { display: grid; grid-template-columns: 1fr auto; gap: .5rem; }
.code-input { text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }
.field-label { display: block; font-weight: 600; margin-bottom: .4rem; }
.hint { color: var(--muted); font-size: .9rem; margin: .4rem 0 1rem; }
.error { color: var(--danger); min-height: 1.5em; margin: .75rem 0 0; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.note { color: var(--muted); font-size: .9rem; margin-top: 1.5rem; }
.role { color: var(--muted); font-size: .9rem; margin: .75rem 0 0; }
.locked input { background: transparent; border-color: transparent; }
#total[readonly] { background: transparent; border-color: transparent; padding-left: 0; }
.amount.done + .sub { color: var(--accent); font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 data-i18n="title">Split the bill</h1>
    <div class="seg" role="group" aria-label="Language / Idioma">
      <button type="button" data-lang="en" lang="en">EN</button>
      <button type="button" data-lang="es" lang="es">ES</button>
    </div>
  </div>

  <!-- Start screen -->
  <section id="home" hidden>
    <div class="panel">
      <h2 data-i18n="homeTitle"></h2>
      <p class="muted" data-i18n="homeText"></p>
      <label class="field-label" for="new-code" data-i18n="nameLabel"></label>
      <input id="new-code" class="code-input" type="text" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="NANDO">
      <p class="hint" data-i18n="nameHint"></p>
      <button type="button" class="primary wide" id="start" data-i18n="startNew"></button>
      <div class="join">
        <label for="join-code" data-i18n="joinLabel"></label>
        <div class="join-row">
          <input id="join-code" class="code-input" type="text" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="K7Q2M">
          <button type="button" id="join" data-i18n="join"></button>
        </div>
      </div>
      <p class="error" id="home-error" role="alert"></p>
    </div>
  </section>

  <!-- Shared bill -->
  <section id="bill" hidden>
    <section class="result" aria-live="polite">
      <div class="label" id="hero-label"></div>
      <div class="amount" id="hero">£0.00</div>
      <div class="sub" id="summary"></div>
      <div class="status" id="status" role="status"></div>
    </section>

    <section class="panel">
      <div class="codebar">
        <div>
          <div class="label" data-i18n="billCode"></div>
          <div class="code" id="code"></div>
        </div>
        <div class="actions">
          <button type="button" class="primary" id="share" data-i18n="share"></button>
          <button type="button" id="new-bill" data-i18n="newBill"></button>
        </div>
      </div>
      <p class="role" id="role"></p>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2><label for="total" data-i18n="totalLabel"></label></h2>
        <div class="seg currency" role="group" id="currency">
          <button type="button" data-currency="GBP">£</button>
          <button type="button" data-currency="EUR">€</button>
          <button type="button" data-currency="USD">$</button>
        </div>
      </div>
      <input id="total" type="text" inputmode="decimal" autocomplete="off" placeholder="64.50">
    </section>

    <section class="panel">
      <h2 data-i18n="whoHadWhat"></h2>
      <p class="empty" id="empty" data-i18n="noPeople"></p>
      <div id="rows"></div>
      <div class="add-row">
        <button type="button" class="primary" id="add-me" data-i18n="addMe"></button>
        <button type="button" class="dashed" id="add-other" data-i18n="addOther"></button>
      </div>
    </section>

    <section class="panel">
      <h2 id="tip-label" data-i18n="service"></h2>
      <div class="stepper" role="group" aria-labelledby="tip-label">
        <button type="button" class="step" id="tip-down">−</button>
        <output id="tip" aria-live="polite">12.5%</output>
        <button type="button" class="step" id="tip-up">+</button>
      </div>
    </section>

    <p class="note" data-i18n="note"></p>
  </section>
</main>
<script>
// ---------- Translations (add a language by copying a block) ----------
const I18N = {
  en: {
    htmlLang: "en-GB",
    title: "Split the bill",
    homeTitle: "Split the bill with your table",
    homeText: "Start a bill, share the link in your group chat, and everyone adds what they had from their own phone.",
    nameLabel: "Name this bill (optional)",
    nameHint: "5 letters or numbers, like the restaurant or your group. Leave it empty for a random code.",
    codeInvalid: "Codes are exactly 5 letters or numbers.",

    startNew: "Start a new bill",
    joinLabel: "Got a code? Join a bill",
    join: "Join",

    newBill: "New bill",

    copyThis: "Copy this link",

    currencyGroup: "Currency",
    currencyNames: { GBP: "British pounds", EUR: "Euros", USD: "US dollars" },
    whoHadWhat: "Who had what",
    noPeople: "No one yet. Tap “Add me” to add what you had.",
    addMe: "Add me",
    addOther: "Add someone else",
    you: "You",
    service: "Service",
    none: "None",
    owes: "owes",
    leftToAssign: "Left to assign",
    overBy: "Over the bill by",
    allAssigned: "Balance is zero",
    readyToPay: "Everyone’s covered. Call the waiter and pay!",
    roleOrganiser: "You started this bill, so you can change the total, the service and everyone’s rows.",
    roleGuest: "You can edit your own row. The person who started the bill sets the total and service.",
    notAllowed: "Only the person who started the bill can change that.",
    assignedSoFar: "Assigned so far",
    typeTotal: "Type the bill total to see what’s left",
    summary: (total, withService, tip) => `of a ${total} bill, which comes to ${withService} with ${tip}% service`,
    loading: "Loading bill…",
    notFound: "We couldn’t find that bill. Check the code.",
    offline: "Can’t reach the server, trying again…",
    full: "This bill has reached the maximum number of people.",
    initialsFor: n => `Initials for person ${n}`,
    spentBy: n => `Amount spent by person ${n}`,
    addItem: n => `Add another item for person ${n}`,
    divideItem: n => `Divide the last amount for person ${n}`,
    removePerson: n => `Remove person ${n}`,
    tipDown: "Lower service by 0.5%",
    tipUp: "Raise service by 0.5%",
    note: "Everyone adds their own row, and the person who started the bill can fix anyone’s. The page updates every few seconds. To add up items, type them with + (for example 12.50+4+3.20) or tap the + button. To get one item from a line like “Coca-Cola 3 11.25”, type 11.25/3 or tap ÷. Service is shared in proportion to what each person spent."
  },
  es: {
    htmlLang: "es",
    title: "Dividir la cuenta",
    homeTitle: "Divide la cuenta con tu mesa",
    homeText: "Empieza una cuenta, comparte el enlace en el grupo y cada uno añade lo que consumió desde su móvil.",
    nameLabel: "Ponle nombre a la cuenta (opcional)",
    nameHint: "5 letras o números, como el restaurante o el grupo. Déjalo vacío para un código al azar.",
    codeInvalid: "Los códigos tienen exactamente 5 letras o números.",
    codeTaken: "Ese código ya se está usando hoy. Únete abajo o elige otro nombre.",
    startNew: "Empezar una cuenta nueva",
    joinLabel: "¿Tienes un código? Únete a una cuenta",
    join: "Unirse",
    billCode: "Código de la cuenta",
    share: "Compartir enlace",
    newBill: "Cuenta nueva",
    copied: "Enlace copiado",
    copyThis: "Copia este enlace",
    shareText: c => `Añade lo que consumiste a nuestra cuenta (código ${c})`,
    totalLabel: "Total de la cuenta (sin servicio)",
    currencyGroup: "Moneda",
    currencyNames: { GBP: "Libras esterlinas", EUR: "Euros", USD: "Dólares estadounidenses" },
    whoHadWhat: "Lo que consumió cada uno",
    noPeople: "Todavía no hay nadie. Toca «Añadirme» para añadir lo tuyo.",
    addMe: "Añadirme",
    addOther: "Añadir a otra persona",
    you: "Tú",
    service: "Servicio",
    none: "Sin servicio",
    owes: "debe",
    leftToAssign: "Falta por asignar",
    overBy: "Se pasa de la cuenta por",
    allAssigned: "Saldo en cero",
    readyToPay: "Ya está todo cubierto. ¡Llamen al camarero y a pagar!",
    roleOrganiser: "Tú empezaste esta cuenta, así que puedes cambiar el total, el servicio y las filas de todos.",
    roleGuest: "Puedes editar tu propia fila. Quien empezó la cuenta pone el total y el servicio.",
    notAllowed: "Solo quien empezó la cuenta puede cambiar eso.",
    assignedSoFar: "Asignado hasta ahora",
    typeTotal: "Escribe el total de la cuenta para ver lo que falta",
    summary: (total, withService, tip) => `de una cuenta de ${total}, que queda en ${withService} con ${tip}% de servicio`,
    loading: "Cargando la cuenta…",
    notFound: "No encontramos esa cuenta. Revisa el código.",
    offline: "No hay conexión con el servidor, reintentando…",
    full: "Esta cuenta ya tiene el número máximo de personas.",
    initialsFor: n => `Iniciales de la persona ${n}`,
    spentBy: n => `Importe que gastó la persona ${n}`,
    addItem: n => `Añadir otro importe a la persona ${n}`,
    divideItem: n => `Dividir el último importe de la persona ${n}`,
    removePerson: n => `Quitar a la persona ${n}`,
    tipDown: "Bajar el servicio un 0,5%",
    tipUp: "Subir el servicio un 0,5%",
    note: "Cada uno añade su propia fila, y quien empezó la cuenta puede corregir la de cualquiera. La página se actualiza cada pocos segundos. Para sumar, escribe los importes con + (por ejemplo 12.50+4+3.20) o toca el botón +. Para sacar una unidad de una línea como «Coca-Cola 3 11.25», escribe 11.25/3 o toca ÷. El servicio se reparte según lo que gastó cada persona."
  }
};

// ---------- Small helpers ----------
const API = "/api/bill";
const POLL_MS = 3000;
const SAVE_DELAY_MS = 600;
const CODE_RE = /^[A-Z0-9]{5}$/;
const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no 0/O or 1/I to avoid mix-ups
const CURRENCIES = ["GBP", "EUR", "USD"];
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const randomFrom = (chars, n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => chars[b % chars.length]).join("");
const newCode = () => randomFrom(ALPHABET, 5);
const newId = (n = 12) => randomFrom("abcdefghijklmnopqrstuvwxyz0123456789", n);
const newKey = () => newId(32);   // secret: proves "I'm the organiser" or "this row is mine"
const clean = v => v.replace(/[^0-9.,+\/* ]/g, "");
const num = s => { const n = parseFloat(String(s).replace(",", ".").replace(/[^0-9.]/g, "")); return isNaN(n) ? null : n; };
// "12.50+11.25/3" = 12.50 + (11.25 ÷ 3). Unfinished bits like "11.25/" are ignored while typing.
function sumOf(text) {
  return String(text || "").split("+").reduce((total, term) => {
    const parts = term.split(/([*\/])/);
    let value = num(parts[0]);
    if (value === null) return total;
    for (let i = 1; i < parts.length; i += 2) {
      const n = num(parts[i + 1]);
      if (n === null) continue;
      if (parts[i] === "/") { if (n !== 0) value /= n; } else value *= n;
    }
    return total + value;
  }, 0);
}

// ---------- Language (per phone) ----------
let lang = store.get("split-lang") || ((navigator.language || "").toLowerCase().startsWith("es") ? "es" : "en");
if (!I18N[lang]) lang = "en";
const t = key => I18N[lang][key];

// ---------- Bill state (shared) ----------
let code = null;
let meta = { total: "", tip: 12.5, currency: "GBP" };
let people = [];                 // [{id, initials, spent, createdAt}]
const pending = new Map();       // id or "meta" -> timer; local edits not yet saved
const removing = new Set();      // ids deleted here, hidden until the server catches up
let pollTimer = null;
let meId = null;
let adminKey = null;             // only on the organiser's phone
let owned = {};                  // rows this phone created: { personId: ownerKey }
const isOrganiser = () => !!adminKey;
const canEdit = id => isOrganiser() || !!owned[id];

const fmt = n => n.toLocaleString("en-GB", { style: "currency", currency: meta.currency, currencyDisplay: "narrowSymbol" });

async function post(body) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ code, adminKey: adminKey || undefined, ...body })
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.error || r.status); e.code = data.error; throw e; }
  return data;
}

function setStatus(msg) { $("status").textContent = msg || ""; }

// ---------- Saving (debounced, so typing doesn't spam the server) ----------
function queueSave(id, delay = SAVE_DELAY_MS) {
  clearTimeout(pending.get(id));
  pending.set(id, setTimeout(() => (id === "meta" ? saveMeta() : savePerson(id)), delay));
}
async function saveMeta() {
  const token = pending.get("meta");
  try {
    await post({ action: "meta", meta });
    if (pending.get("meta") === token) pending.delete("meta");
    setStatus("");
  } catch (e) {
    if (e.code === "forbidden") { pending.delete("meta"); setStatus(t("notAllowed")); fetchBill(); return; }
    setStatus(t("offline"));
    if (pending.get("meta") === token) queueSave("meta", 3000);
  }
}
async function savePerson(id) {
  const token = pending.get(id);
  const p = people.find(x => x.id === id);
  if (!p) { pending.delete(id); return; }
  try {
    await post({ action: "person", id, ownerKey: owned[id], initials: p.initials, spent: p.spent });
    if (pending.get(id) === token) pending.delete(id);
    setStatus("");
  } catch (e) {
    if (e.code === "full") { pending.delete(id); people = people.filter(x => x.id !== id); setStatus(t("full")); render(); return; }
    if (e.code === "forbidden") { pending.delete(id); setStatus(t("notAllowed")); fetchBill(); return; }
    setStatus(t("offline"));
    if (pending.get(id) === token) queueSave(id, 3000);
  }
}

// ---------- Loading & live updates ----------
async function fetchBill() {
  if (!code) return;
  const forCode = code;
  try {
    const r = await fetch(`${API}?code=${forCode}`, { cache: "no-store" });
    if (forCode !== code) return;
    if (r.status === 404) { stopPolling(); showHome(t("notFound")); return; }
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    setStatus("");
    mergeFromServer(data);
  } catch (e) {
    setStatus(t("offline"));
  }
}

function mergeFromServer(data) {
  if (!pending.has("meta")) meta = data.meta;
  const fromServer = new Set(data.people.map(p => p.id));
  const next = data.people
    .filter(p => !removing.has(p.id))
    .map(p => (pending.has(p.id) ? people.find(x => x.id === p.id) || p : p));
  // keep people added here that the server hasn't stored yet
  people.forEach(p => { if (pending.has(p.id) && !fromServer.has(p.id)) next.push(p); });
  people = next;
  render();
}

function startPolling() { stopPolling(); pollTimer = setInterval(() => { if (!document.hidden) fetchBill(); }, POLL_MS); }
function stopPolling() { clearInterval(pollTimer); pollTimer = null; }
document.addEventListener("visibilitychange", () => { if (!document.hidden && code) fetchBill(); });

// ---------- Screens ----------
function route() {
  const c = location.hash.slice(1).toUpperCase();
  if (CODE_RE.test(c)) openBill(c); else showHome();
}
window.addEventListener("hashchange", route);

function showHome(error) {
  code = null; stopPolling();
  $("bill").hidden = true; $("home").hidden = false;
  $("home-error").textContent = error || "";
  $("start").disabled = false;
}

function openBill(c) {
  if (code === c) return;
  code = c;
  people = []; pending.clear(); removing.clear();
  meId = store.get(`split-me-${c}`);
  adminKey = store.get(`split-admin-${c}`);
  owned = store.get(`split-owned-${c}`) || {};
  $("home").hidden = true; $("bill").hidden = false;
  $("code").textContent = c;
  $("rows").innerHTML = "";
  setStatus(t("loading"));
  render();
  fetchBill();
  startPolling();
}

async function startBill() {
  $("start").disabled = true;
  $("home-error").textContent = "";
  const prefs = store.get("split-prefs") || {};
  const chosen = $("new-code").value.trim().toUpperCase();
  if (chosen && !CODE_RE.test(chosen)) {
    $("home-error").textContent = t("codeInvalid");
    $("start").disabled = false;
    return;
  }
  for (let attempt = 0; attempt < (chosen ? 1 : 3); attempt++) {
    const c = chosen || newCode();
    const key = newKey();
    try {
      const r = await fetch(API, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ code: c, action: "create", adminKey: key, meta: { total: "", tip: prefs.tip ?? 12.5, currency: prefs.currency || "GBP" } })
      });
      if (r.ok) { store.set(`split-admin-${c}`, key); $("new-code").value = ""; location.hash = c; return; }
      if (r.status === 409 && chosen) {     // their own name is in use today
        $("home-error").textContent = t("codeTaken");
        $("start").disabled = false;
        return;
      }
      if (r.status !== 409) break;          // 409 on a random code: try another
    } catch (e) { break; }
  }
  $("home-error").textContent = t("offline");
  $("start").disabled = false;
}

function joinBill() {
  const c = $("join-code").value.trim().toUpperCase();
  if (CODE_RE.test(c)) location.hash = c;
  else $("home-error").textContent = t("codeInvalid");
}

async function shareBill() {
  const url = `${location.origin}${location.pathname}#${code}`;
  if (navigator.share) {
    try { await navigator.share({ title: t("title"), text: t("shareText")(code), url }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); setStatus(""); flash(t("copied")); }
  catch (e) { window.prompt(t("copyThis"), url); }
}
function flash(msg) {
  const b = $("share"); b.textContent = msg;
  setTimeout(() => { b.textContent = t("share"); }, 1800);
}

// ---------- People ----------
function addPerson(isMe) {
  const p = { id: newId(), initials: "", spent: "", createdAt: Date.now() };
  people.push(p);
  owned[p.id] = newKey();
  store.set(`split-owned-${code}`, owned);
  if (isMe) { meId = p.id; store.set(`split-me-${code}`, meId); }
  queueSave(p.id, 0);
  render();
  const input = document.querySelector(`[data-id="${p.id}"] .initials`);
  if (input) input.focus();
}

async function removePerson(id) {
  removing.add(id);
  clearTimeout(pending.get(id)); pending.delete(id);
  people = people.filter(p => p.id !== id);
  render();
  try { await post({ action: "remove", id, ownerKey: owned[id] }); }
  catch (e) {
    removing.delete(id);
    setStatus(e.code === "forbidden" ? t("notAllowed") : t("offline"));
    fetchBill();
  }
  setTimeout(() => removing.delete(id), 10000);
}

function makeRow(id) {
  const row = document.createElement("div");
  row.className = "person";
  row.dataset.id = id;
  row.innerHTML = `
    <div class="inputs">
      <label class="sr" data-role="ini-label" for="in-${id}"></label>
      <input class="initials" id="in-${id}" type="text" maxlength="3" autocomplete="off">
      <label class="sr" data-role="sp-label" for="sp-${id}"></label>
      <input class="spent" id="sp-${id}" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">
      <button type="button" class="plus">+</button>
      <button type="button" class="divide">÷</button>
    </div>
    <div class="meta">
      <span class="left"><span class="you" hidden></span><span class="calc"></span></span>
      <span class="right">
        <span class="owes"><span class="owes-word"></span> <strong></strong></span>
        <button type="button" class="remove">×</button>
      </span>
    </div>`;
  const ini = row.querySelector(".initials");
  const sp = row.querySelector(".spent");
  const find = () => people.find(x => x.id === id);
  ini.addEventListener("input", e => {
    const p = find(); if (!p) return;
    p.initials = e.target.value.toUpperCase(); e.target.value = p.initials;
    queueSave(id); render();
  });
  sp.addEventListener("input", e => {
    const p = find(); if (!p) return;
    p.spent = clean(e.target.value); e.target.value = p.spent;
    queueSave(id); render();
  });
  const addOperator = op => {
    const p = find(); if (!p) return;
    const v = p.spent.trim();
    if (v && !/[+\/*]$/.test(v)) p.spent = v + op;
    sp.value = p.spent; sp.focus();
    queueSave(id); render();
  };
  row.querySelector(".plus").addEventListener("click", () => addOperator("+"));
  row.querySelector(".divide").addEventListener("click", () => addOperator("/"));
  row.querySelector(".remove").addEventListener("click", () => removePerson(id));
  return row;
}

// ---------- Drawing the page ----------
function render() {
  const factor = 1 + meta.tip / 100;
  const box = $("rows");
  const existing = new Map([...box.children].map(el => [el.dataset.id, el]));
  let assigned = 0;

  people.forEach((p, i) => {
    let row = existing.get(p.id);
    if (!row) row = makeRow(p.id);
    existing.delete(p.id);
    if (box.children[i] !== row) box.insertBefore(row, box.children[i] || null);

    const n = i + 1;
    const ini = row.querySelector(".initials");
    const sp = row.querySelector(".spent");
    // never overwrite what someone is typing on this phone
    if (document.activeElement !== ini && ini.value !== p.initials) ini.value = p.initials;
    if (document.activeElement !== sp && sp.value !== p.spent) sp.value = p.spent;
    ini.placeholder = String.fromCharCode(65 + (i % 26));
    const editable = canEdit(p.id);
    row.classList.toggle("locked", !editable);
    ini.readOnly = sp.readOnly = !editable;
    row.querySelector(".plus").hidden = row.querySelector(".divide").hidden = row.querySelector(".remove").hidden = !editable;
    if (!editable) sp.placeholder = "";
    row.querySelector('[data-role="ini-label"]').textContent = t("initialsFor")(n);
    row.querySelector('[data-role="sp-label"]').textContent = t("spentBy")(n);
    row.querySelector(".plus").setAttribute("aria-label", t("addItem")(n));
    row.querySelector(".divide").setAttribute("aria-label", t("divideItem")(n));
    row.querySelector(".remove").setAttribute("aria-label", t("removePerson")(n));

    const spent = sumOf(p.spent);
    assigned += spent;
    const you = row.querySelector(".you");
    you.hidden = p.id !== meId; you.textContent = t("you");
    row.querySelector(".calc").textContent = /[+\/*]/.test(p.spent)
      ? `${p.spent.replace(/\s+/g, "").replace(/[+\/*]+$/, "").replace(/\+/g, " + ").replace(/\//g, " ÷ ").replace(/\*/g, " × ")} = ${fmt(spent)}` : "";
    row.querySelector(".owes-word").textContent = t("owes");
    row.querySelector(".owes strong").textContent = fmt(spent * factor);
  });
  existing.forEach(el => el.remove());

  $("empty").hidden = people.length > 0;
  $("add-me").hidden = !!meId && people.some(p => p.id === meId);
  $("add-other").hidden = !isOrganiser();
  $("role").textContent = isOrganiser() ? t("roleOrganiser") : t("roleGuest");
  $("total").readOnly = !isOrganiser();

  const totalInput = $("total");
  if (document.activeElement !== totalInput && totalInput.value !== meta.total) totalInput.value = meta.total;

  const total = sumOf(meta.total);
  const hero = $("hero");
  hero.classList.remove("over", "done");
  if (!total) {
    $("hero-label").textContent = t("assignedSoFar");
    hero.textContent = fmt(assigned);
    $("summary").textContent = t("typeTotal");
  } else {
    const left = Math.round((total - assigned) * 100) / 100;
    if (left > 0) { $("hero-label").textContent = t("leftToAssign"); hero.textContent = fmt(left); }
    else if (left < 0) { $("hero-label").textContent = t("overBy"); hero.textContent = fmt(-left); hero.classList.add("over"); }
    else { $("hero-label").textContent = t("allAssigned"); hero.textContent = fmt(0); hero.classList.add("done"); }
    $("summary").textContent = left === 0 && people.length
      ? t("readyToPay")
      : t("summary")(fmt(total), fmt(total * factor), meta.tip);
  }

  $("tip").textContent = meta.tip ? meta.tip + "%" : t("none");
  $("tip-down").disabled = !isOrganiser() || meta.tip <= 0;
  $("tip-up").disabled = !isOrganiser() || meta.tip >= 30;
  document.querySelectorAll("#currency button").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.currency === meta.currency));
    b.disabled = !isOrganiser() && b.dataset.currency !== meta.currency;
  });
}

function applyLanguage() {
  document.documentElement.lang = t("htmlLang");
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("button[data-lang]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("tip-down").setAttribute("aria-label", t("tipDown"));
  $("tip-up").setAttribute("aria-label", t("tipUp"));
  $("currency").setAttribute("aria-label", t("currencyGroup"));
  document.querySelectorAll("#currency button").forEach(b => {
    b.setAttribute("aria-label", t("currencyNames")[b.dataset.currency]);
    b.title = t("currencyNames")[b.dataset.currency];
  });
  if (code) render();
}

// ---------- Wiring ----------
function changeMeta(patch) {
  if (!isOrganiser()) return;
  Object.assign(meta, patch);
  store.set("split-prefs", { tip: meta.tip, currency: meta.currency });
  queueSave("meta");
  render();
}
$("total").addEventListener("input", e => { e.target.value = clean(e.target.value); changeMeta({ total: e.target.value }); });
$("tip-down").addEventListener("click", () => changeMeta({ tip: Math.max(0, Math.round((meta.tip - 0.5) * 2) / 2) }));
$("tip-up").addEventListener("click", () => changeMeta({ tip: Math.min(30, Math.round((meta.tip + 0.5) * 2) / 2) }));
document.querySelectorAll("#currency button").forEach(b =>
  b.addEventListener("click", () => { if (CURRENCIES.includes(b.dataset.currency)) changeMeta({ currency: b.dataset.currency }); }));
document.querySelectorAll("button[data-lang]").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; store.set("split-lang", lang); applyLanguage();
}));
$("start").addEventListener("click", startBill);
$("join").addEventListener("click", joinBill);
$("join-code").addEventListener("keydown", e => { if (e.key === "Enter") joinBill(); });
$("new-code").addEventListener("keydown", e => { if (e.key === "Enter") startBill(); });
// codes are letters and numbers only, always in capitals
document.querySelectorAll(".code-input").forEach(input => input.addEventListener("input", () => {
  input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 5);
}));
$("share").addEventListener("click", shareBill);
$("new-bill").addEventListener("click", () => { history.pushState(null, "", location.pathname); showHome(); });
$("add-me").addEventListener("click", () => addPerson(true));
$("add-other").addEventListener("click", () => addPerson(false));

applyLanguage();
route();
</script>
</body>
</html>
